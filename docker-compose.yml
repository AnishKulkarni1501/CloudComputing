services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - forumhub-mongo:/data/db

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/forum
      JWT_SECRET: local-compose-secret-change-before-deploy
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - forumhub-uploads:/app/uploads
    depends_on:
      - mongo

  web:
    build:
      context: .
      args:
        REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  forumhub-mongo:
  forumhub-uploads:
